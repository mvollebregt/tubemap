<svg
  class="graph"
  [attr.viewBox]="'0 0 ' + layout().width + ' ' + layout().height"
  role="img"
  aria-label="Visualisatie van de graaf met punten en verbindingen"
  xmlns="http://www.w3.org/2000/svg"
>
  <g class="connections" aria-hidden="true">
    @for (line of layout().lines; track line.id) {
      <line
        [attr.x1]="line.x1"
        [attr.y1]="line.y1"
        [attr.x2]="line.x2"
        [attr.y2]="line.y2"
        [style.stroke]="line.color"
      />
    }
  </g>

  <g class="points">
    @for (point of stationMarkers(); track point.id) {
      <g
        class="point"
        [attr.transform]="'translate(' + point.x + ' ' + point.y + ')'"
        role="img"
        [attr.aria-label]="point.name"
      >
        @if (point.type === 'tick') {
          <line class="point-tick" x1="0" y1="0" [attr.x2]="point.tickX" [attr.y2]="point.tickY" />
        } @else {
          <circle class="point-interchange" r="6" />
        }
        <text
          [attr.x]="point.labelX"
          [attr.y]="point.labelY"
          [attr.text-anchor]="point.labelAnchor"
        >
          {{ point.name }}
        </text>
      </g>
    }
  </g>
</svg>
