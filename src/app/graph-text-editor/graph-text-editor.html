<section class="editor" aria-labelledby="graph-editor-title">
  <h2 id="graph-editor-title">Graaf invoer</h2>
  <p id="graph-editor-help">
    Eén punt per regel. Een lege regel onderbreekt de verbinding. Herhaal een label om hetzelfde
    punt te gebruiken.
  </p>
  <textarea
    id="graph-text"
    [value]="text()"
    (input)="onInput($event)"
    aria-labelledby="graph-editor-title"
    aria-describedby="graph-editor-help"
    spellcheck="false"
  ></textarea>
</section>
